[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tarel"
version = "0.0.2"
description = "A local-first analytics context compiler for coding agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MPS" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["analytics", "context", "metadata", "semantic-layer", "lineage", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Mattiascherzgit/tarel"
Repository = "https://github.com/Mattiascherzgit/tarel"
Issues = "https://github.com/Mattiascherzgit/tarel/issues"
Documentation = "https://github.com/Mattiascherzgit/tarel/tree/master/docs"

[project.optional-dependencies]
sqlite = []
sqlserver = [
  "pymssql>=2.3,<3",
]
local-rag = [
  "llama-cpp-python>=0.3.16,<0.4",
]
dev = [
  "build>=1.2,<2",
  "ruff>=0.11",
]

[project.scripts]
tarel = "tarel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tarel"]

[tool.hatch.build.targets.sdist]
only-include = [
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
  "docs/change-radar.md",
  "docs/context-contract.md",
  "docs/local-retrieval.md",
  "docs/retail-demo.md",
  "docs/workspaces.md",
  "pyproject.toml",
  "src",
  "tests",
  "tools/check_distribution.py",
]

[tool.hatch.build]
exclude = [
  "/.tarel",
  "/AGENTS.md",
  "/models",
  "/tests/local_databases.toml",
  "**/AGENTS.md",
  "**/*.gguf",
  "**/*.sqlite",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
