name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Test
        run: python -m unittest discover -s tests -q
      - name: Compile
        run: python -m compileall -q src tests tools

  package:
    name: Build and smoke-test package
    needs: quality
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1580601600"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install -e ".[dev]"
      - name: Build distributions
        run: python -m build
      - name: Inspect distributions
        run: python tools/check_distribution.py dist
      - name: Install and exercise the wheel
        run: |
          python -m venv "$RUNNER_TEMP/tarel-wheel"
          "$RUNNER_TEMP/tarel-wheel/bin/python" -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/tarel-smoke"
          cd "$RUNNER_TEMP/tarel-smoke"
          "$RUNNER_TEMP/tarel-wheel/bin/tarel" --version
          "$RUNNER_TEMP/tarel-wheel/bin/tarel" demo create retail-dwh
          "$RUNNER_TEMP/tarel-wheel/bin/tarel" source configure retail-local \
            --connector sqlite \
            --config-ref state:demos/retail-dwh.toml \
            --namespace main \
            --format json > source.json
          "$RUNNER_TEMP/tarel-wheel/bin/tarel" source check retail-local \
            --format json > check.json
          "$RUNNER_TEMP/tarel-wheel/bin/tarel" source probe retail-local \
            --format json > probe.json
          "$RUNNER_TEMP/tarel-wheel/bin/tarel" source build retail-local retail-demo \
            --format json > graph.json
          "$RUNNER_TEMP/tarel-wheel/bin/tarel" grounding retail-demo \
            "annual net sales by channel" \
            --source retail-local \
            --format json > grounding.json
          "$RUNNER_TEMP/tarel-wheel/bin/python" -c \
            'import json; assert json.load(open("probe.json"))["read_only"] is True'
          "$RUNNER_TEMP/tarel-wheel/bin/python" -c \
            'import json; assert json.load(open("graph.json"))["nodes"] == 70'
          "$RUNNER_TEMP/tarel-wheel/bin/python" -c \
            'import json; assert json.load(open("check.json"))["config_status"] == "resolved"'
          "$RUNNER_TEMP/tarel-wheel/bin/python" -c \
            'import json; assert json.load(open("grounding.json"))["stable"]["sources"][0]["source"] == "retail-local"'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
