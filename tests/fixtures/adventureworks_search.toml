graph = "adventureworks_dw"
catalog = "AdventureWorksDW2025"
namespace = "dbo"

# This corpus checks retrieval, not query generation. Expected relationships are
# declared source foreign keys and are verified separately with read-only counts.

[[cases]]
id = "internet_sales_currency"
question = "Which objects describe internet sales revenue by currency?"
query = "internet sales amount currency"
primary_object = "dbo.FactInternetSales"
supporting_objects = ["dbo.DimCurrency"]
required_fields = [
  "dbo.FactInternetSales.SalesAmount",
  "dbo.FactInternetSales.CurrencyKey",
  "dbo.DimCurrency.CurrencyName",
]
relationships = [
  "dbo.FactInternetSales.CurrencyKey -> dbo.DimCurrency.CurrencyKey",
]

